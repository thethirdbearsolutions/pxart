[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pxart"
version = "0.1.0"
description = "Pixel art as text: sprites a language model can write, git can diff, and you can read"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.urls]
Homepage = "https://github.com/thethirdbearsolutions/pxart"

[project.scripts]
pxart = "pxart:main"

[tool.setuptools]
py-modules = ["pxart"]
