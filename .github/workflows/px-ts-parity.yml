name: px.ts parity

# js/px.ts must draw every frame x variant of examples/ byte for byte as pxart.py renders it; bench/cast/web/pxc.js
# must gunzip a cast by its bytes (tests/test_pxc_js.py).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: pip install pillow pytest
      - run: python -m pytest -v tests/test_px_ts.py tests/test_pxc_js.py
